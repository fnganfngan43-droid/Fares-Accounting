name: Build Fares Accounting APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل المشروع
        uses: actions/checkout@v4

      - name: فك ضغط مشروع التطبيق
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "لم يتم العثور على ملف ZIP في المستودع."
            exit 1
          fi

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -type f -name package.json -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "لم يتم العثور على مجلد المشروع داخل ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "تم العثور على المشروع: $PROJECT_DIR"

      - name: التحقق من أيقونة التطبيق
        shell: bash
        run: |
          set -e
          if [ -f "$PROJECT_DIR/public/pwa-512x512.png" ]; then
            echo "ICON=$PROJECT_DIR/public/pwa-512x512.png" >> "$GITHUB_ENV"
          elif [ -f "$PROJECT_DIR/public/pwa-192x192.png" ]; then
            echo "ICON=$PROJECT_DIR/public/pwa-192x192.png" >> "$GITHUB_ENV"
          else
            echo "لم يتم العثور على أيقونة التطبيق."
            exit 1
          fi

      - name: إنشاء مشروع Android
        shell: bash
        run: |
          set -e

          mkdir -p android-app/app/src/main/java/com/fares/accounting
          mkdir -p android-app/app/src/main/res/values

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }

          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }

          rootProject.name = "FaresAccounting"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.fares.accounting'
            compileSdk 35

            defaultConfig {
              applicationId 'com.fares.accounting'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

          cat > android-app/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
            <string name="app_name">رفيق المحاسب</string>
          </resources>
          EOF

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#1976D2</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:statusBarColor">#000000</item>
            </style>
          </resources>
          EOF

      - name: تجهيز أيقونة Android
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y imagemagick

          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi

          convert "$ICON" -resize 48x48 android-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$ICON" -resize 72x72 android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$ICON" -resize 96x96 android-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$ICON" -resize 144x144 android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$ICON" -resize 192x192 android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp android-app/app/src/main/res/mipmap-mdpi/ic_launcher.png android-app/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png android-app/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png android-app/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: إنشاء AndroidManifest
        shell: bash
        run: |
          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />

            <application
              android:label="@string/app_name"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:theme="@style/AppTheme"
              android:usesCleartextTraffic="true"
              android:hardwareAccelerated="true">

              <activity
                android:name=".MainActivity"
                android:screenOrientation="portrait"
                android:exported="true">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>

              </activity>
            </application>
          </manifest>
          EOF

      - name: إنشاء MainActivity مع الملفات والطباعة
        shell: bash
        run: |
          cat > android-app/app/src/main/java/com/fares/accounting/MainActivity.java <<'JAVA'
          package com.fares.accounting;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView webView;
            private WebView printWebView;
            private ValueCallback<Uri[]> fileCallback;
            private static final int FILE_CHOOSER = 1001;

            @Override
            protected void onCreate(Bundle state) {
              super.onCreate(state);

              webView = new WebView(this);
              setContentView(webView);

              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setDatabaseEnabled(true);
              settings.setAllowFileAccess(true);
              settings.setAllowContentAccess(true);

              CookieManager.getInstance().setAcceptCookie(true);
              CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

              webView.addJavascriptInterface(new PrintBridge(), "AndroidPrint");

              webView.setWebViewClient(new WebViewClient());

              webView.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(
                    WebView view,
                    ValueCallback<Uri[]> callback,
                    FileChooserParams params) {

                  fileCallback = callback;

                  try {
                    Intent intent = params.createIntent();
                    intent.addCategory(Intent.CATEGORY_OPENABLE);
                    startActivityForResult(intent, FILE_CHOOSER);
                  } catch (Exception e) {
                    fileCallback = null;
                    callback.onReceiveValue(null);
                  }

                  return true;
                }
              });

              webView.loadUrl("https://fares-2026.lovable.app/");
            }

            private class PrintBridge {
              @JavascriptInterface
              public void printPage(final String html) {
                new Handler(Looper.getMainLooper()).post(
                  () -> startPrint(html)
                );
              }

              @JavascriptInterface
              public void printHtml(final String html, final String name) {
                new Handler(Looper.getMainLooper()).post(
                  () -> startPrint(html)
                );
              }
            }

            private void startPrint(String html) {
              try {
                if (printWebView != null) {
                  try {
                    printWebView.destroy();
                  } catch (Exception ignored) {}
                }

                printWebView = new WebView(this);

                WebSettings settings = printWebView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setAllowContentAccess(true);

                printWebView.setWebViewClient(new WebViewClient() {
                  @Override
                  public void onPageFinished(WebView view, String url) {
                    new Handler(Looper.getMainLooper()).postDelayed(
                      () -> openPrintDialog(view),
                      500
                    );
                  }
                });

                printWebView.loadDataWithBaseURL(
                  "https://fares-2026.lovable.app/",
                  html,
                  "text/html",
                  "UTF-8",
                  null
                );

              } catch (Exception e) {
                e.printStackTrace();
              }
            }

            private void openPrintDialog(WebView view) {
              try {
                PrintManager printManager =
                    (PrintManager) getSystemService(PRINT_SERVICE);

                PrintAttributes attributes =
                    new PrintAttributes.Builder()
                      .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                      .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                      .setColorMode(PrintAttributes.COLOR_MODE_COLOR)
                      .build();

                printManager.print(
                  "رفيق المحاسب - طباعة",
                  view.createPrintDocumentAdapter("رفيق المحاسب"),
                  attributes
                );

              } catch (Exception e) {
                e.printStackTrace();
              }
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);

              if (requestCode == FILE_CHOOSER && fileCallback != null) {
                Uri[] results = null;

                if (resultCode == RESULT_OK && data != null) {
                  if (data.getClipData() != null) {
                    int count = data.getClipData().getItemCount();
                    results = new Uri[count];

                    for (int i = 0; i < count; i++) {
                      results[i] = data.getClipData().getItemAt(i).getUri();
                    }
                  } else if (data.getData() != null) {
                    results = new Uri[]{data.getData()};
                  }
                }

                fileCallback.onReceiveValue(results);
                fileCallback = null;
              }
            }

            @Override
            public void onBackPressed() {
              if (webView != null && webView.canGoBack()) {
                webView.goBack();
              } else {
                super.onBackPressed();
              }
            }

            @Override
            protected void onDestroy() {
              if (printWebView != null) {
                try { printWebView.destroy(); } catch (Exception ignored) {}
              }

              if (webView != null) {
                try { webView.destroy(); } catch (Exception ignored) {}
              }

              super.onDestroy();
            }
          }
          JAVA

      - name: إعداد Java و Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: بناء APK
        working-directory: android-app
        run: |
          gradle clean assembleDebug --no-daemon

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: Fares-Accounting-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
